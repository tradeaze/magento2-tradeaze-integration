# OpenSearch service for the Magento 2 dev store (required search engine
# for Magento 2.4.x). Reachable from the web container at opensearch:9200.
services:
  opensearch:
    container_name: ddev-${DDEV_SITENAME}-opensearch
    image: opensearchproject/opensearch:2.19.0
    restart: "no"
    expose:
      - "9200"
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    volumes:
      - opensearch:/usr/share/opensearch/data
      - ".:/mnt/ddev_config"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  opensearch:
