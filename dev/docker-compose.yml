# docker-compose fallback for the local dev store (ddev is preferred —
# see docs/development.md). Started by ./dev/setup.sh --compose.
name: tradeaze-magento2

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html:cached
      - composer-cache:/tmp/composer
    environment:
      REPO_ROOT: /var/www/html
      BASE_URL: http://localhost:8080/
      DB_HOST: db
      DB_NAME: db
      DB_USER: db
      DB_PASSWORD: db
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      COMPOSER_HOME: /tmp/composer
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  db:
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: db
      MARIADB_USER: db
      MARIADB_PASSWORD: db
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  db-data:
  os-data:
  composer-cache:
