name: Dev store smoke test

# Boots the full local dev store (docker compose path: Magento 2.4.8 +
# Luma sample data + this module symlinked in) from dev/setup.sh alone,
# then asserts the storefront renders. Slow (~30 min), so it runs on
# demand, weekly, and when the dev environment itself changes — not on
# every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
  push:
    paths:
      - 'dev/**'
      - '.ddev/**'
      - '.github/workflows/dev-store-smoke.yml'
  pull_request:
    paths:
      - 'dev/**'
      - '.ddev/**'
      - '.github/workflows/dev-store-smoke.yml'

concurrency:
  group: dev-store-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-store:
    name: Boot store via dev/setup.sh --compose
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Raise vm.max_map_count for OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Run one-command setup
        run: ./dev/setup.sh --compose

      - name: Smoke test storefront
        run: |
          # First render in developer mode is slow; be patient.
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 300 -o /dev/null http://localhost:8080/
          # Luma sample data category page must render a product grid.
          curl -fsS --max-time 300 http://localhost:8080/women.html \
            | grep -q 'products-grid'
          echo "Storefront and category product grid OK."

      - name: Verify module enabled
        run: |
          docker compose -f dev/docker-compose.yml exec -T -u www-data web \
            php /var/www/html/dev/magento/bin/magento module:status Tradeaze_ApiIntegration \
            | tee /dev/stderr | grep -q 'enabled'

      - name: Re-run setup to prove idempotence
        run: ./dev/setup.sh --compose

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f dev/docker-compose.yml ps || true
          docker compose -f dev/docker-compose.yml logs --tail=150 || true
          docker compose -f dev/docker-compose.yml exec -T web \
            bash -c 'tail -n 100 /var/www/html/dev/magento/var/log/*.log' || true
